apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: harbor
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: harbor-gateway
  template:
    metadata:
      labels:
        app: harbor-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: harbor-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harbor-auth
                  key: ADMIN_TOKEN
            - name: GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harbor-auth
                  key: GATEWAY_TOKEN
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: PROVIDER
              value: mock
            - name: RATE_LIMIT_PER_MINUTE
              value: "30"
            - name: CACHE_TTL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: harbor
spec:
  selector:
    app: harbor-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: harbor
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: harbor-gateway
