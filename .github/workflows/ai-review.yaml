name: Independent AI review gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      # No checkout and no execution of PR code. Read reviews from GitHub only.
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const reviews = await github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number: number, per_page: 100});
            const trusted = 'chatgpt-codex-connector[bot]';
            const current = reviews.filter(r => r.user?.login === trusted && r.user?.type === 'Bot' && r.commit_id === pr.head.sha);
            const decision = current.at(-1);
            const state = decision?.state === 'APPROVED' ? 'success' : decision?.state === 'CHANGES_REQUESTED' ? 'failure' : 'pending';
            await github.rest.repos.createCommitStatus({owner, repo, sha: pr.head.sha,
              context: 'Harbor / AI review', state, target_url: decision?.html_url || pr.html_url,
              description: state === 'success' ? 'Independent Codex approval verified for this exact head' : 'Waiting for independent Codex APPROVED review on this exact head'});
            if (state !== 'success') core.notice('Merge remains blocked. Comments, reactions, old-head approvals and this chat do not satisfy independent approval. Configure the review integration; never fabricate approval.');
